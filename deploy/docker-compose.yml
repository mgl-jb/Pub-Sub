# The whole system on one machine: the broker, its SQL Server and Redis, and the two sample
# services that publish to it and consume from it.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Then place an order and watch the worker pick it up:
#
#   curl -X POST http://localhost:8081/orders \
#     -H 'content-type: application/json' \
#     -d '{"customerId":"cust-1","region":"emea","total":750}'

name: pubsub

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # Dependent services must not start until SQL Server can actually answer a query; the
      # container being "up" happens well before that.
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  broker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.broker
    depends_on:
      sqlserver:
        condition: service_healthy
      # Redis only accelerates dispatch, so the broker starts whether or not it is ready.
      redis:
        condition: service_started
    environment:
      ConnectionStrings__Broker: >-
        Server=sqlserver,1433;Database=PubSubBroker;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True;
      Redis__ConnectionString: redis:6379
      # Local development only. In Azure this is left unset and Entra ID is required.
      Broker__DisableAuthentication: "true"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  orders-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.orders
    depends_on:
      sqlserver:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      ConnectionStrings__Orders: >-
        Server=sqlserver,1433;Database=SampleOrders;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True;
      PubSub__BrokerUri: http://broker:8080
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8080"

  shipping-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.shipping
    depends_on:
      sqlserver:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      ConnectionStrings__Shipping: >-
        Server=sqlserver,1433;Database=SampleShipping;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True;
      PubSub__BrokerUri: http://broker:8080
      DOTNET_ENVIRONMENT: Development
    # Consumers are the thing you scale; the broker hands each replica a disjoint set of messages.
    deploy:
      replicas: 2

volumes:
  sqldata:
